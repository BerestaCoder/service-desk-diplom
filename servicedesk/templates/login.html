<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Service Desk | Вход в учётную запись</title>
    <!-- Google Fonts + Font Awesome 6 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static "css/styles.css" %}" />
    <style>
        body {
            background: linear-gradient(125deg, #eef2ff 0%, #e0e8f5 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        /* декоративный фон-сетка */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 25% 40%, rgba(59,130,246,0.03) 2%, transparent 2.5%);
            background-size: 48px 48px;
            pointer-events: none;
        }

        /* основная карточка входа */
        .login-container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.2s ease;
            position: relative;
            z-index: 2;
        }

        /* верхняя декоративная полоса */
        .brand-header {
            background: #ffffff;
            padding: 32px 32px 16px 32px;
            text-align: center;
            border-bottom: 1px solid #eff3f8;
        }

        .logo-icon {
            background: #eff6ff;
            width: 64px;
            height: 64px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            color: #2563eb;
            font-size: 2rem;
            box-shadow: 0 6px 12px -6px rgba(0,0,0,0.05);
        }

        .brand-header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0f2b3d, #1e3a5f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .brand-sub {
            font-size: 0.85rem;
            color: #5b6e8c;
            margin-top: 6px;
            font-weight: 500;
        }

        /* тело формы */
        .login-form {
            padding: 32px 36px 40px 36px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #1f2a44;
        }

        .input-label i {
            color: #3b82f6;
            width: 18px;
            font-size: 0.9rem;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 28px;
            background: #ffffff;
            transition: all 0.2s;
            outline: none;
            color: #0f172a;
        }

        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        /* опции: запомнить меня и забыли пароль */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 28px 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #475569;
            cursor: pointer;
        }

        .checkbox-label input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #2563eb;
        }

        .forgot-link {
            font-size: 0.85rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .forgot-link:hover {
            text-decoration: underline;
            color: #1d4ed8;
        }

        /* кнопка входа */
        .login-btn {
            background: #2563eb;
            border: none;
            width: 100%;
            padding: 14px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: inherit;
            box-shadow: 0 4px 8px rgba(37,99,235,0.2);
        }

        .login-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37,99,235,0.3);
        }

        /* разделитель */
        .divider {
            margin: 28px 0 20px;
            text-align: center;
            position: relative;
        }

        .divider span {
            background: #ffffff;
            padding: 0 14px;
            color: #8b9abb;
            font-size: 0.75rem;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #e9edf2;
            z-index: 0;
        }

        /* демо-подсказка */
        .demo-hint {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            margin-top: 24px;
            border: 1px solid #eef2ff;
            font-size: 0.75rem;
            color: #3b5a7c;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .demo-hint i {
            font-size: 1.2rem;
            color: #3b82f6;
        }

        .demo-hint strong {
            color: #1e293b;
        }

        /* ссылка на регистрацию */
        .signup-redirect {
            text-align: center;
            margin-top: 28px;
            font-size: 0.85rem;
            color: #5b6e8c;
        }

        .signup-redirect a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-redirect a:hover {
            text-decoration: underline;
        }

        /* сообщение об ошибке / успехе (тост) */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            backdrop-filter: blur(8px);
            background-color: rgba(30, 41, 59, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: opacity 0.2s;
            pointer-events: none;
        }

        /* адаптивность */
        @media (max-width: 520px) {
            .login-form {
                padding: 28px 24px;
            }
            .brand-header {
                padding: 28px 24px 12px;
            }
            .login-container {
                border-radius: 36px;
            }
        }

        /* анимация загрузки для кнопки */
        .btn-loading {
            opacity: 0.8;
            pointer-events: none;
        }
        .btn-loading i {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="brand-header">
        <div class="logo-icon">
            <i class="fas fa-headset"></i>
        </div>
        <h1>Service Desk</h1>
        <div class="brand-sub">Центр управления инцидентами</div>
    </div>

    <div class="login-form">
        <!-- форма входа -->
        <form id="loginForm" action="#" method="post">
            <div class="form-group">
                <div class="input-label">
                    <i class="fas fa-envelope"></i>
                    <span>Электронная почта</span>
                </div>
                <input type="email" id="emailInput" class="input-field" autocomplete="email">
            </div>

            <div class="form-group">
                <div class="input-label">
                    <i class="fas fa-lock"></i>
                    <span>Пароль</span>
                </div>
                <input type="password" id="passwordInput" class="input-field" autocomplete="current-password">
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberCheckbox"> Запомнить меня
                </label>
                <a href="#" class="forgot-link" id="forgotPasswordLink">Забыли пароль?</a>
            </div>

            <button type="submit" id="loginButton" class="login-btn">
                <i class="fas fa-arrow-right-to-bracket"></i> Войти в систему
            </button>
        </form>
    </div>
</div>
</body>
</html>
