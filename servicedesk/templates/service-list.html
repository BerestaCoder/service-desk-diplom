<!DOCTYPE html>
{% load static %}
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Услуги</title>
    <!-- Google Fonts и базовые стили -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static "css/styles.css" %}" />
</head>
<body>
    <div class="container">
        {% include 'includes/header.html' %}
        <!-- Основной контент: две колонки (первая таблица + вторая с большим списком) -->
        <div class="main-container">
            <div class="main-container-header">
                <div class="header-and-buttons">
                    <h1><i class="fas fa-bell-concierge" style="margin-right: 6px;"></i> Услуги</h1>
                    <div class="action-buttons">
                        <button class="btn btn-primary"><i class="fas fa-pen"></i> Создать услугу</button>
                    </div>
                </div>
            </div>
            <div class="main-body">
                <div class="center-container">
                    <div class="info-card">
                        <div class="card-header">
                            
                        </div>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Номер</th>
                                    <th>Тип</th>
                                    <th>Название</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for service in services %}
                                <tr class="clickable-row" data-href="/service/{{ service.id }}">
                                    <td>{{ service.id }}</td>
                                    <td>{{ service.get_service_type_display }}</td>
                                    <td class="wrap-text">{{ service.name }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
                <!--
                <div class="sidebar">
                    <div class="info-card">
                        <div class="card-header">
                            <i class="fas fa-filter"></i> Фильтры
                        </div>
                        <div class="card-content">
                            <div class="field-row">
                                <div class="field-label">Параметр</div>
                                <div class="field-value">-</div>
                            </div>
                        </div>
                    </div>
                </div>
                -->
            </div>
        </div>
    </div>
</body>
<script>
    // Кликабельные строки таблицы 
    document.querySelectorAll('.clickable-row').forEach(row => {
        row.addEventListener('click', function () {
            window.location.href = this.dataset.href;
        });
    });
</script>
</html>
