<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{{ ticket_code }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static "css/styles.css" %}" />
</head>
<body>
    <div class="container">
        <div class="header-nav">
            <div class="logo-area">
                <h1><i class="fas fa-headset" style="margin-right: 10px; color: #3b82f6;"></i>Сервисный центр</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 28px; flex-wrap: wrap;">
                <div class="nav-links-mini">
                    <a href="{% url 'main' %}"><i class="fas fa-home"></i> Главная</a>
                    <a href="{% url 'create-ticket' %}"><i class="fas fa-plus-circle"></i> Создать заявку</a>
                    <a href="{% url 'service-list' %}"><i class="fas fa-bell-concierge"></i> Услуги</a>
                    <a href="{% url 'diagram' %}"><i class="fas fa-chart-column"></i> Отчёты</a>
                </div>
                <div class="user-greeting">
                    <i class="fas fa-user-circle"></i>
                    <span>Иванов И.И.</span>
                    <i class="fas fa-chevron-down" style="font-size: 0.7rem; opacity: 0.7;"></i>
                </div>
            </div>
        </div>
        <!-- Заголовок тикета -->
        <div class="main-container">
            <div class="main-container-header">
                <div class="header-and-buttons">
                    <h1><i class="fas fa-ticket-alt" style="margin-right: 6px;"></i> {{ service.name  }}</h1>
                    <div class="action-buttons">
                        <button class="btn btn-outline"><i class="fas fa-user-plus"></i> Удалить</button>
                        <button class="btn btn-primary"><i class="fas fa-user-check"></i> Изменить</button>
                    </div>
                </div>
            </div>
            <div class="main-body">
                <div class="center-container">
                    <!-- Описание -->
                    <div class="info-card">
                        <div class="card-header">
                            <i class="fas fa-align-left"></i> Описание
                        </div>
                        <div class="card-content">
                            <div class="field-row">
                                <div class="field-label">Тип услуги</div>
                                <div class="field-value">{{ service.get_service_type_display }}</div>
                            </div>
                            <div class="field-row">
                                <div class="field-label">Название</div>
                                <div class="field-value">{{ service.name }}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
